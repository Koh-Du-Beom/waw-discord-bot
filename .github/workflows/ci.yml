name: CI

on:
  pull_request:
    branches: [develop, production]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          WAW_SKIP_POSTGRES_INTEGRATION: "1"
      - run: npm run typecheck
      - run: npm run build
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --omit=dev
      - run: bash deploy/test-production-application-assets.sh
      - run: bash deploy/test-production-release-manager.sh
      - run: bash scripts/test-deploy-production-via-lightsail.sh
      - run: bash scripts/test-wait-production-health.sh
      - run: git diff --check
