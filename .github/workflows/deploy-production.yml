name: Deploy production

on:
  push:
    branches: [production]

permissions:
  contents: read

concurrency:
  group: waw-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate deployment authority
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ vars.LIGHTSAIL_USER }}
        run: |
          test "$GITHUB_REF" = refs/heads/production
          test -n "$LIGHTSAIL_HOST"
          test -n "$LIGHTSAIL_USER"
      - name: Prepare SSH credentials
        env:
          LIGHTSAIL_DEPLOY_SSH_KEY: ${{ secrets.LIGHTSAIL_DEPLOY_SSH_KEY }}
          LIGHTSAIL_SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$LIGHTSAIL_DEPLOY_SSH_KEY"
          test -n "$LIGHTSAIL_SSH_KNOWN_HOSTS"
          printf '%s\n' "$LIGHTSAIL_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/waw-deploy-key"
          printf '%s\n' "$LIGHTSAIL_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/waw-known-hosts"
          chmod 600 "$RUNNER_TEMP/waw-deploy-key" "$RUNNER_TEMP/waw-known-hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/waw-deploy-key" >/dev/null
      - name: Deploy exact commit
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ vars.LIGHTSAIL_USER }}
          WAW_DEPLOY_SSH_KEY_FILE: ${{ runner.temp }}/waw-deploy-key
          WAW_DEPLOY_KNOWN_HOSTS_FILE: ${{ runner.temp }}/waw-known-hosts
          WAW_RELEASE_COMMIT: ${{ github.sha }}
        run: bash scripts/deploy-production-via-lightsail.sh
      - name: Remove SSH credentials
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/waw-deploy-key" "$RUNNER_TEMP/waw-known-hosts"
